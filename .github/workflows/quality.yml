name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  conventions:
    name: Formatting and conventions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check formatting
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi
      - name: Check file sizes
        run: |
          git ls-files '*.go' | while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 300 ]; then
              echo "$file exceeds 300 lines ($lines)"
              exit 1
            fi
          done
      - name: Validate Conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/version.mjs --validate-title
      - name: Test versioning
        run: node --test .github/scripts/version.test.mjs
      - name: Install pinned linter with the project Go toolchain
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
      - name: Lint
        run: golangci-lint run --timeout=5m ./...

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          install: mingw-w64-x86_64-gcc
          update: false
      - name: Configure Windows C compiler
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cygpath -w /mingw64/bin >> "$GITHUB_PATH"
      - name: Tests with race detection and coverage
        shell: bash
        env:
          CGO_ENABLED: '1'
          CC: gcc
        run: go test -race -coverprofile="coverage.out" ./...
      - name: Vet
        env:
          CGO_ENABLED: '1'
          CC: gcc
        run: go vet ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
